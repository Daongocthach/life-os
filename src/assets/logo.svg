<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep obsidian space background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a10" />
      <stop offset="50%" stop-color="#11131f" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Refined rim border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="40%" stop-color="rgba(99, 102, 241, 0.4)" />
      <stop offset="75%" stop-color="rgba(168, 85, 247, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.05)" />
    </linearGradient>

    <!-- Radial atmospheric glow -->
    <radialGradient id="coreGlow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.42" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Monogram L Gradient (Cyan -> Indigo -> Violet -> Rose) -->
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Ring O Gradient (Electric Violet -> Pink -> Coral) -->
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Core Life Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Elevation shadow -->
    <filter id="brandShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#6366f1" flood-opacity="0.42" />
    </filter>
    
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Rounded Container with subtle depth border -->
  <rect x="16" y="16" width="480" height="480" rx="116" ry="116" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="256" cy="256" r="200" fill="url(#coreGlow)" />

  <!-- Logo Graphics Group -->
  <g filter="url(#brandShadow)">
    <!-- 1. The "O" Orbital Ring (Life Cycle & Operating System) -->
    <circle cx="286" cy="234" r="78" fill="none" stroke="url(#oGrad)" stroke-width="38" stroke-linecap="round" />

    <!-- 2. The "L" Monogram (The Foundation & Structure of Life) -->
    <path d="M168 144 L168 332 C168 351.9 184.1 368 204 368 L340 368" fill="none" stroke="url(#lGrad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />

    <!-- 3. Central Life Spark (✦) - The vibrant energy & intelligence at the core of LifeOS -->
    <g filter="url(#sparkGlow)">
      <path d="M286 196 Q286 234 248 234 Q286 234 286 272 Q286 234 324 234 Q286 234 286 196 Z" fill="url(#sparkGrad)" />
      <circle cx="286" cy="234" r="3.5" fill="#ffffff" />
    </g>
  </g>
</svg>